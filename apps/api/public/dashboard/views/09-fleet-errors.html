      <!-- ================================================================= -->
      <!-- PESTAÑA SUPERADMIN: TELEMETRÍA DE ERRORES DE FLOTA                 -->
      <!-- ================================================================= -->
      <div id="view-tab-fleet-errors" class="hidden space-y-6">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 bg-[#12151e] border border-white/[0.12] rounded-xl p-5">
          <div>
            <div class="flex items-center gap-2.5">
              <span class="w-2 h-2 rounded-full bg-amber-400"></span>
              <h2 class="text-sm sm:text-base font-semibold text-white tracking-tight">Diagnóstico e Incidencias de Agentes</h2>
              <span id="fleet-errors-count" class="px-2 py-0.5 rounded bg-white/[0.06] border border-white/[0.12] text-[11px] font-mono text-zinc-300">0 incidencias</span>
            </div>
            <p class="text-xs text-zinc-400 mt-1">
              Registro centralizado de alertas técnicas en servidores clientes: desconexiones OLEDB, bloqueos de fichero (.ldb) y red.
            </p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <input id="fleet-errors-search" type="text" oninput="filterAndRenderFleetErrors()" placeholder="Buscar equipo, código o mensaje..." class="w-48 sm:w-56 bg-[#0e1118] border border-white/[0.14] rounded-md px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500" />
            <select id="fleet-errors-filter" onchange="filterAndRenderFleetErrors()" class="bg-[#0e1118] border border-white/[0.14] rounded-md px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none focus:border-indigo-500 cursor-pointer">
              <option value="ALL">Severidad: Todas</option>
              <option value="FATAL">Solo FATAL</option>
              <option value="WARNING">Solo WARNING</option>
            </select>
            <button onclick="loadFleetErrors()" class="px-3.5 py-1.5 rounded-md bg-[#181c26] hover:bg-[#222736] text-zinc-200 border border-white/[0.14] text-xs font-medium transition cursor-pointer">
              Actualizar
            </button>
          </div>
        </div>

        <div class="bg-[#12151e] border border-white/[0.12] rounded-xl overflow-hidden">
          <div class="overflow-x-auto custom-scroll">
            <table class="w-full text-left text-xs min-w-[760px]">
              <thead class="bg-[#171b26] text-[10px] font-mono uppercase font-semibold text-zinc-400 border-b border-white/[0.1]">
                <tr>
                  <th class="p-3.5">Equipo / Hostname</th>
                  <th class="p-3.5">Organización</th>
                  <th class="p-3.5 whitespace-nowrap">Módulo</th>
                  <th class="p-3.5">Detalle Técnico &amp; Código</th>
                  <th class="p-3.5 whitespace-nowrap">Fecha / Hora</th>
                  <th class="p-3.5 text-right whitespace-nowrap">Severidad</th>
                </tr>
              </thead>
              <tbody id="fleet-errors-tbody" class="divide-y divide-white/[0.06]">
                <tr>
                  <td colspan="6" class="p-8 text-center text-zinc-400 font-mono text-xs">
                    Cargando registro de incidencias...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
