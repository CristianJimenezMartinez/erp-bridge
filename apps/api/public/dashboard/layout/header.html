    <header class="h-14 border-b border-white/[0.06] bg-[#09090b]/80 backdrop-blur-md px-6 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg overflow-hidden flex items-center justify-center border border-white/[0.12] shadow-md shadow-indigo-500/20 bg-[#121215]">
          <img src="/assets/icon.svg" alt="Bentian ERP Bridge" class="w-full h-full object-contain" width="32" height="32">
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-xs text-zinc-100 tracking-tight">Bentian ERP Bridge</span>
            <span id="top-role-badge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
              Multi-Seat Cloud
            </span>
          </div>
          <span class="text-[10px] text-zinc-500" id="top-org-label">Organización: Sede Central</span>
        </div>
      </div>

      <!-- NAVEGACIÓN DINÁMICA DE PESTAÑAS (SEGÚN ROL) -->
      <nav id="dashboard-nav" class="hidden md:flex items-center gap-1 bg-[#121215] p-1 rounded-lg border border-white/[0.06] text-xs">
        <!-- Renderizado dinámico vía JavaScript según rol -->
      </nav>

      <div class="flex items-center gap-3">
        <!-- MONITOR DE LATENCIA EN VIVO -->
        <button onclick="pingLiveServer()" id="top-latency-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-mono bg-[#18181b] hover:bg-[#222228] text-emerald-400 border border-emerald-500/20 transition cursor-pointer" title="Tiempo de respuesta del último clic o petición (haz clic para medir ping)">
          <span id="top-latency-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="top-latency-text">-- ms</span>
        </button>

        <span class="hidden lg:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 status-pulse"></span>
          Conexión Segura
        </span>

        <a href="/releases/latest/Bentian-Setup.exe" data-download-installer class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[#18181b] hover:bg-[#27272a] text-zinc-300 text-[11px] font-medium border border-white/[0.08] transition">
          <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>Instalador (.exe)</span>
        </a>

        <a href="/docs/seguridad/antivirus-edr-smartscreen/" target="_blank" class="hidden xl:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 text-[11px] font-medium border border-amber-500/30 transition" title="Guía de ayuda contra bloqueos de SmartScreen y antivirus">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <span>Ayuda SmartScreen / Antivirus</span>
        </a>

        <div class="h-4 w-[1px] bg-white/[0.08]"></div>

        <!-- DROPDOWN PERFIL & CERRAR SESIÓN -->
        <div class="relative" id="user-menu-container">
          <button 
            id="user-menu-btn" 
            onclick="toggleUserDropdown(event)" 
            class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-[#18181b] hover:bg-[#222228] border border-white/[0.08] hover:border-white/[0.16] transition text-left focus:outline-none focus:ring-1 focus:ring-indigo-500 group cursor-pointer"
          >
            <div class="w-5 h-5 rounded-full bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-[10px] font-bold text-indigo-300 shrink-0">
              <span id="user-avatar-char">U</span>
            </div>
            <span id="user-display" class="text-[11px] text-zinc-200 font-mono truncate max-w-[120px] sm:max-w-[160px]">Usuario</span>
            <svg id="user-dropdown-chevron" class="w-3 h-3 text-zinc-400 group-hover:text-zinc-200 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>

          <!-- Menú desplegable -->
          <div 
            id="user-dropdown-menu" 
            class="hidden absolute right-0 top-full mt-2 w-64 rounded-xl bg-[#121215] border border-white/[0.1] shadow-2xl p-1.5 z-50 font-sans"
          >
            <div class="px-3 py-2 border-b border-white/[0.06] mb-1">
              <div class="text-[10px] font-mono text-zinc-500 uppercase tracking-wider">Sesión iniciada como</div>
              <div id="dropdown-user-email" class="text-xs font-semibold text-zinc-100 font-mono truncate mt-0.5">-</div>
              <div id="dropdown-role-label" class="text-[10px] text-indigo-400 font-mono mt-0.5 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Conectado a Bentian Cloud
              </div>
            </div>

            <a href="/releases/latest/Bentian-Setup.exe" data-download-installer class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-zinc-300 hover:text-white hover:bg-white/[0.05] rounded-lg transition">
              <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>Descargar Agente Windows (.exe)</span>
            </a>

            <a href="/docs/seguridad/antivirus-edr-smartscreen/" target="_blank" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-amber-300 hover:text-amber-200 hover:bg-amber-500/10 rounded-lg transition">
              <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              <span>Guía SmartScreen & Antivirus</span>
            </a>

            <button onclick="openStripePortal(); toggleUserDropdown(event)" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-zinc-300 hover:text-white hover:bg-white/[0.05] rounded-lg transition text-left cursor-pointer">
              <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
              <span>Gestionar Suscripción Stripe</span>
            </button>

            <div class="border-t border-white/[0.06] my-1"></div>

            <button 
              onclick="handleLogout()" 
              class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition text-left font-medium cursor-pointer"
            >
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              <span>Cerrar sesión</span>
            </button>
          </div>
        </div>
      </div>
    </header>
