    <header class="h-16 border-b border-white/[0.12] bg-[#0b0d13]/95 backdrop-blur-md px-4 lg:px-6 flex items-center justify-between gap-3 sticky top-0 z-30 shadow-lg shadow-black/30">
      <div class="flex items-center gap-2.5 shrink-0">
        <img src="/assets/icon.svg" alt="Bentian ERP Bridge" class="w-8 h-8 object-contain shrink-0" width="32" height="32">
        <div class="whitespace-nowrap">
          <div class="flex items-center gap-2">
            <span class="font-bold text-xs sm:text-sm text-white tracking-tight">Bentian ERP Bridge</span>
            <span id="top-role-badge" class="text-[10px] font-mono font-semibold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-200 border border-indigo-400/40 whitespace-nowrap">
              Multi-Seat Cloud
            </span>
          </div>
          <span class="text-[11px] text-zinc-300 font-medium block" id="top-org-label">Organización: Sede Central</span>
        </div>
      </div>

      <!-- NAVEGACIÓN DINÁMICA DE PESTAÑAS (SEGÚN ROL, 1 SOLA LÍNEA) -->
      <nav id="dashboard-nav" class="hidden md:flex items-center gap-1 bg-[#151822] p-1 rounded-xl border border-white/[0.14] text-xs overflow-x-auto custom-scroll max-w-full">
        <!-- Renderizado dinámico vía JavaScript según rol -->
      </nav>

      <div class="flex items-center gap-2.5 shrink-0">
        <!-- MONITOR DE LATENCIA EN VIVO -->
        <button onclick="pingLiveServer()" id="top-latency-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-[11px] font-mono font-semibold bg-[#1e2230] hover:bg-[#282d40] text-emerald-300 border border-emerald-400/40 transition cursor-pointer whitespace-nowrap shrink-0" title="Tiempo de respuesta del último clic o petición (haz clic para medir ping)">
          <span id="top-latency-dot" class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
          <span id="top-latency-text">-- ms</span>
        </button>

        <a href="/releases/latest/Bentian-Setup.exe" data-download-installer class="hidden 2xl:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#1e2230] hover:bg-[#282d40] text-white text-xs font-medium border border-white/[0.15] transition whitespace-nowrap shrink-0">
          <svg class="w-3.5 h-3.5 text-indigo-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>Instalador (.exe)</span>
        </a>

        <!-- DROPDOWN PERFIL & CERRAR SESIÓN -->
        <div class="relative shrink-0" id="user-menu-container">
          <button 
            id="user-menu-btn" 
            onclick="toggleUserDropdown(event)" 
            class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#1e2230] hover:bg-[#282d40] border border-white/[0.16] hover:border-indigo-400/50 transition text-left focus:outline-none focus:ring-2 focus:ring-indigo-500 group cursor-pointer whitespace-nowrap"
          >
            <div class="w-5 h-5 rounded-full bg-indigo-600 text-white border border-indigo-400/50 flex items-center justify-center text-[10px] font-bold shrink-0">
              <span id="user-avatar-char">U</span>
            </div>
            <span id="user-display" class="text-xs text-white font-mono font-medium truncate max-w-[130px] sm:max-w-[160px]">Usuario</span>
            <svg id="user-dropdown-chevron" class="w-3.5 h-3.5 text-zinc-300 group-hover:text-white transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>

          <!-- Menú desplegable -->
          <div 
            id="user-dropdown-menu" 
            class="hidden absolute right-0 top-full mt-2 w-64 rounded-xl bg-[#151822] border border-white/[0.18] shadow-2xl p-1.5 z-50 font-sans"
          >
            <div class="px-3 py-2.5 border-b border-white/[0.1] mb-1">
              <div class="text-[10px] font-mono text-zinc-300 uppercase tracking-wider font-semibold">Sesión iniciada como</div>
              <div id="dropdown-user-email" class="text-xs font-bold text-white font-mono truncate mt-0.5">-</div>
              <div id="dropdown-role-label" class="text-[11px] text-indigo-300 font-mono mt-1 flex items-center gap-1.5 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Conectado a Bentian Cloud
              </div>
            </div>

            <a href="/releases/latest/Bentian-Setup.exe" data-download-installer class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-zinc-100 hover:text-white hover:bg-white/[0.08] rounded-lg transition font-medium">
              <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>Descargar Agente Windows (.exe)</span>
            </a>

            <a href="/docs/seguridad/antivirus-edr-smartscreen/" target="_blank" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-amber-300 hover:text-amber-200 hover:bg-amber-500/15 rounded-lg transition font-medium">
              <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              <span>Guía SmartScreen & Antivirus</span>
            </a>

            <button onclick="openStripePortal(); toggleUserDropdown(event)" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-zinc-100 hover:text-white hover:bg-white/[0.08] rounded-lg transition text-left cursor-pointer font-medium">
              <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
              <span>Gestionar Suscripción Stripe</span>
            </button>

            <div class="border-t border-white/[0.1] my-1"></div>

            <button 
              onclick="handleLogout()" 
              class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-red-400 hover:text-red-300 hover:bg-red-500/15 rounded-lg transition text-left font-semibold cursor-pointer"
            >
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              <span>Cerrar sesión</span>
            </button>
          </div>
        </div>
      </div>
    </header>
