<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/dashboard/">
  <meta name="robots" content="noindex, nofollow">
  <title>Bentian ERP Bridge — Panel de Control Cloud Multi-Tenant</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta name="theme-color" content="#09090b">
  <meta name="application-name" content="Bentian Cloud Dashboard">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.96); }
    }
    .status-pulse { animation: pulse-subtle 2s infinite ease-in-out; }
  </style>
  <script>
    // Fail-safe modal & interactive controller (Immediate availability guarantee)
    function closeModal(id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    }
    function openPartnerBuyModal() {
      var nameEl = document.getElementById('partner-buy-client-name');
      var taxEl = document.getElementById('partner-buy-tax-id');
      var emailEl = document.getElementById('partner-buy-email');
      var aliasEl = document.getElementById('partner-buy-alias');
      if (nameEl) nameEl.value = '';
      if (taxEl) taxEl.value = '';
      if (emailEl) emailEl.value = '';
      if (aliasEl) aliasEl.value = '';
      var modal = document.getElementById('modal-partner-buy');
      if (modal) modal.classList.remove('hidden');
    }
    function openPartnerIssueModal() {
      var nameEl = document.getElementById('partner-issue-client-name');
      var taxEl = document.getElementById('partner-issue-tax-id');
      var aliasEl = document.getElementById('partner-issue-alias');
      if (nameEl) nameEl.value = '';
      if (taxEl) taxEl.value = '';
      if (aliasEl) aliasEl.value = '';
      var modal = document.getElementById('modal-partner-issue');
      if (modal) modal.classList.remove('hidden');
    }
    function openNewKeyModal() {
      var modal = document.getElementById('modal-new-key');
      if (modal) modal.classList.remove('hidden');
    }
    function openInstructionsModal() {
      var modal = document.getElementById('modal-instructions');
      if (modal) modal.classList.remove('hidden');
    }
    function openEditAliasModal(id, currentAlias) {
      var idEl = document.getElementById('edit-alias-id');
      var inputEl = document.getElementById('edit-alias-input');
      if (idEl) idEl.value = id || '';
      if (inputEl) inputEl.value = currentAlias || '';
      var modal = document.getElementById('modal-edit-alias');
      if (modal) modal.classList.remove('hidden');
    }
    function openUnbindModal(id, key, hostname, hwid) {
      var idEl = document.getElementById('unbind-license-id');
      var hwidEl = document.getElementById('unbind-hwid');
      var nameEl = document.getElementById('unbind-machine-name');
      var keyEl = document.getElementById('unbind-key-display');
      if (idEl) idEl.value = id || '';
      if (hwidEl) hwidEl.value = hwid || '';
      if (nameEl) nameEl.innerText = hostname || 'Equipo Actual';
      if (keyEl) keyEl.innerText = key || 'EB-XXXXX';
      var modal = document.getElementById('modal-unbind');
      if (modal) modal.classList.remove('hidden');
    }
  </script>
</head>
<body class="bg-[#09090b] text-[#f4f4f5] antialiased min-h-full flex flex-col selection:bg-indigo-500/30 selection:text-indigo-200">
