  <!-- ============================================================ -->
  <!-- MODAL: EMISIÓN DE EVALUACIÓN TEMPORAL (15 DÍAS)              -->
  <!-- ============================================================ -->
  <div id="modal-partner-issue" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm p-3 sm:p-4 md:p-6 flex min-h-full items-end sm:items-center justify-center">
    <div class="relative w-full max-w-lg max-h-[calc(100dvh-2rem)] flex flex-col bg-[#121215] border border-white/[0.1] rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <!-- Cabecera -->
      <div class="shrink-0 bg-[#151518] px-5 py-4 border-b border-white/[0.06] flex items-center justify-between">
        <h3 class="text-sm font-semibold text-white">Emitir Clave de Evaluación (15 días)</h3>
        <button onclick="closeModal('modal-partner-issue')" class="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.08] transition cursor-pointer" aria-label="Cerrar modal">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Formulario y Contenido -->
      <form onsubmit="handlePartnerIssueSubmit(event)" class="flex flex-col flex-1 min-h-0">
        <!-- Cuerpo scrollable -->
        <div class="p-5 overflow-y-auto custom-scroll space-y-4 flex-1">
          <p class="text-xs text-zinc-400 leading-relaxed">
            Se dará de alta a la empresa en tu cartera y se generará su clave de activación de forma instantánea.
          </p>

          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Razón Social o Nombre del Cliente</label>
            <input 
              type="text" 
              id="partner-issue-client-name" 
              placeholder="ej. Ferretería Industrial SL" 
              required 
              class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500"
            />
          </div>

          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">CIF / NIF de la Empresa (Obligatorio)</label>
            <input 
              type="text" 
              id="partner-issue-tax-id" 
              placeholder="ej. B12345678" 
              required 
              class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 font-mono uppercase focus:outline-none focus:border-emerald-500"
            />
            <p class="text-[10px] text-zinc-500 mt-1">El conector validará este CIF directamente en la base de datos Factusol del cliente.</p>
          </div>

          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Alias del Servidor</label>
            <input 
              type="text" 
              id="partner-issue-alias" 
              placeholder="ej. Servidor Factusol Central" 
              class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500"
            />
          </div>
        </div>

        <!-- Pie de acciones -->
        <div class="px-5 py-3.5 bg-[#151518] border-t border-white/[0.06] flex items-center justify-end gap-2.5 shrink-0">
          <button type="button" onclick="closeModal('modal-partner-issue')" class="px-3 py-1.5 rounded-md text-xs text-zinc-400 hover:text-white transition cursor-pointer">
            Cancelar
          </button>
          <button type="submit" id="btn-submit-partner-issue" class="px-3.5 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition cursor-pointer">
            Emitir Licencia Base
          </button>
        </div>
      </form>
    </div>
  </div>
