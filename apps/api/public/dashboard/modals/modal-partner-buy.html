  <!-- ============================================================ -->
  <!-- MODAL: COMPRA MAYORISTA DE LICENCIA (PARTNER -25%)           -->
  <!-- ============================================================ -->
  <div id="modal-partner-buy" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm p-3 sm:p-4 md:p-6 flex min-h-full items-end sm:items-center justify-center">
    <div class="relative w-full max-w-lg max-h-[calc(100dvh-2rem)] flex flex-col bg-[#121215] border border-white/[0.1] rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <!-- Cabecera -->
      <div class="shrink-0 bg-[#151518] px-5 py-4 border-b border-white/[0.06] flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-md bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">-25%</span>
          <h3 class="text-sm font-semibold text-white">Comprar Licencia (Tarifa Partner)</h3>
        </div>
        <button onclick="closeModal('modal-partner-buy')" class="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.08] transition cursor-pointer" aria-label="Cerrar modal">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Formulario y Contenido -->
      <form onsubmit="handlePartnerBuySubmit(event)" class="flex flex-col flex-1 min-h-0">
        <!-- Cuerpo scrollable -->
        <div class="p-5 overflow-y-auto custom-scroll space-y-4 flex-1">
          <div class="p-3 bg-emerald-950/20 border border-emerald-500/20 rounded-lg text-xs text-emerald-200/90 leading-relaxed flex items-center justify-between">
            <div>
              <span class="text-[11px] text-zinc-400 block">Tarifa Mayorista de Distribuidor:</span>
              <strong class="text-base text-emerald-400 font-bold font-mono">149,25 €</strong> <span class="text-zinc-400 text-[11px]">/ año + IVA</span>
            </div>
            <span class="text-[10px] font-mono px-2 py-1 rounded bg-emerald-500/20 text-emerald-300 font-semibold border border-emerald-500/30">PVP: 199,00 €</span>
          </div>

          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Razón Social o Nombre del Cliente</label>
            <input 
              type="text" 
              id="partner-buy-client-name" 
              placeholder="ej. Ferretería Industrial SL" 
              required 
              class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500"
            />
          </div>

          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">CIF / NIF de la Empresa (Obligatorio)</label>
            <input 
              type="text" 
              id="partner-buy-tax-id" 
              placeholder="ej. B12345678" 
              required 
              class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 font-mono uppercase focus:outline-none focus:border-emerald-500"
            />
          </div>

          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Email del Cliente (opcional)</label>
            <input 
              type="email" 
              id="partner-buy-email" 
              placeholder="administracion@cliente.com" 
              class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500"
            />
          </div>

          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Alias del Servidor Factusol</label>
            <input 
              type="text" 
              id="partner-buy-alias" 
              placeholder="ej. Servidor Factusol Central" 
              class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500"
            />
          </div>
        </div>

        <!-- Pie de acciones -->
        <div class="px-5 py-3.5 bg-[#151518] border-t border-white/[0.06] flex items-center justify-end gap-2.5 shrink-0">
          <button type="button" onclick="closeModal('modal-partner-buy')" class="px-3 py-1.5 rounded-md text-xs text-zinc-400 hover:text-white transition cursor-pointer">
            Cancelar
          </button>
          <button type="submit" id="btn-submit-partner-buy" class="px-4 py-2 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-md transition flex items-center gap-1.5 cursor-pointer">
            <span>Pagar en Stripe (149,25 €) →</span>
          </button>
        </div>
      </form>
    </div>
  </div>
