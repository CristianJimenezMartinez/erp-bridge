  <!-- ============================================================ -->
  <!-- MODAL: DESVINCULAR EQUIPO (MUDANZA PC)                       -->
  <!-- ============================================================ -->
  <div id="modal-unbind" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm p-3 sm:p-4 md:p-6 flex min-h-full items-end sm:items-center justify-center">
    <div class="relative w-full max-w-lg max-h-[calc(100dvh-2rem)] flex flex-col bg-[#121215] border border-white/[0.1] rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <!-- Cabecera -->
      <div class="shrink-0 bg-[#151518] px-5 py-4 border-b border-white/[0.06] flex items-center justify-between">
        <div class="flex items-center gap-2.5 text-amber-400">
          <div class="w-6 h-6 rounded-lg bg-amber-500/10 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <h3 class="text-sm font-semibold text-zinc-100">¿Mudar Licencia a un Nuevo PC?</h3>
        </div>
        <button onclick="closeModal('modal-unbind')" class="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.08] transition cursor-pointer" aria-label="Cerrar modal">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Cuerpo scrollable -->
      <div class="p-5 overflow-y-auto custom-scroll space-y-4 flex-1">
        <p class="text-xs text-zinc-300 leading-relaxed">
          Estás a punto de desvincular el equipo <strong id="unbind-machine-name" class="text-white font-mono">PC-ACTUAL</strong> de la clave <span id="unbind-key-display" class="font-mono text-indigo-400">EB-XXXXX</span>.
        </p>

        <p class="text-[11px] text-zinc-400 bg-white/[0.02] p-2.5 rounded-lg border border-white/[0.04]">
          ✓ La licencia quedará liberada al instante para que actives esta misma clave en tu nuevo ordenador.<br/>
          ✓ No necesitas contactar a soporte técnico.
        </p>

        <input type="hidden" id="unbind-license-id" />
        <input type="hidden" id="unbind-hwid" />
      </div>

      <!-- Pie de acciones -->
      <div class="px-5 py-3.5 bg-[#151518] border-t border-white/[0.06] flex items-center justify-end gap-2.5 shrink-0">
        <button onclick="closeModal('modal-unbind')" class="px-3 py-1.5 rounded-md text-xs text-zinc-400 hover:text-white transition cursor-pointer">
          Cancelar
        </button>
        <button onclick="confirmUnbind()" id="btn-confirm-unbind" class="px-3.5 py-1.5 rounded-md bg-amber-600 hover:bg-amber-500 text-white text-xs font-medium transition cursor-pointer">
          Confirmar y Liberar Licencia
        </button>
      </div>
    </div>
  </div>
