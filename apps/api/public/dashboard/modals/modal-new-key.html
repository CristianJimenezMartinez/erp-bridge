  <!-- ============================================================ -->
  <!-- MODAL: GENERAR NUEVA CLAVE DE SERVIDOR                       -->
  <!-- ============================================================ -->
  <div id="modal-new-key" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#121215] border border-white/[0.08] rounded-xl p-6 max-w-md w-full shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-zinc-100">Vincular Nuevo Servidor / Generar Clave</h3>
        <button onclick="closeModal('modal-new-key')" class="text-zinc-500 hover:text-zinc-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <p class="text-xs text-zinc-400">
        Asigna un nombre para identificar el servidor o PC donde se ejecutará el conector con Factusol.
      </p>

      <form onsubmit="handleCreateLicenseSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-medium text-zinc-400 mb-1">Nombre / Alias del Servidor</label>
          <input 
            type="text" 
            id="new-key-alias" 
            placeholder="ej. Servidor Factusol Central" 
            required 
            class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label class="block text-[11px] font-medium text-zinc-400 mb-1">Tipo de Puesto</label>
          <select id="new-key-seat-type" class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 focus:outline-none focus:border-indigo-500">
            <option value="BASE" selected>Licencia Base Principal (199 €/año)</option>
            <option value="ADDITIONAL_SEAT">Puesto Adicional Mismo CIF (99 €/año)</option>
          </select>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button type="button" onclick="closeModal('modal-new-key')" class="px-3 py-1.5 rounded-md text-xs text-zinc-400 hover:text-white">
            Cancelar
          </button>
          <button type="submit" id="btn-submit-key" class="px-3.5 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium transition">
            Generar Clave
          </button>
        </div>
      </form>
    </div>
  </div>
