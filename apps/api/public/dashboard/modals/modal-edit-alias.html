  <!-- MODAL: EDITAR ALIAS                                         -->
  <!-- ============================================================ -->
  <div id="modal-edit-alias" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm p-3 sm:p-4 md:p-6 flex min-h-full items-end sm:items-center justify-center">
    <div class="relative w-full max-w-lg max-h-[calc(100dvh-2rem)] flex flex-col bg-[#121215] border border-white/[0.1] rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <!-- Cabecera -->
      <div class="shrink-0 bg-[#151518] px-5 py-4 border-b border-white/[0.06] flex items-center justify-between">
        <h3 class="text-sm font-semibold text-zinc-100">Editar Nombre del Servidor</h3>
        <button onclick="closeModal('modal-edit-alias')" class="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-white/[0.08] transition cursor-pointer" aria-label="Cerrar modal">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Cuerpo scrollable -->
      <div class="p-5 overflow-y-auto custom-scroll space-y-4 flex-1">
        <input type="hidden" id="edit-alias-id" />
        <div>
          <label class="block text-[11px] font-medium text-zinc-400 mb-1">Nuevo Nombre del Servidor</label>
          <input 
            type="text" 
            id="edit-alias-input" 
            class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 focus:outline-none focus:border-indigo-500"
          />
        </div>
      </div>

      <!-- Pie de acciones -->
      <div class="px-5 py-3.5 bg-[#151518] border-t border-white/[0.06] flex items-center justify-end gap-2.5 shrink-0">
        <button onclick="closeModal('modal-edit-alias')" class="px-3 py-1.5 rounded-md text-xs text-zinc-400 hover:text-white transition cursor-pointer">
          Cancelar
        </button>
        <button onclick="handleSaveAlias()" class="px-3.5 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium transition cursor-pointer">
          Guardar Cambios
        </button>
      </div>
    </div>
  </div>
