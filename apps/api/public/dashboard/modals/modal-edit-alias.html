  <!-- MODAL: EDITAR ALIAS                                         -->
  <!-- ============================================================ -->
  <div id="modal-edit-alias" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[#121215] border border-white/[0.08] rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-zinc-100">Editar Nombre del Servidor</h3>
        <button onclick="closeModal('modal-edit-alias')" class="text-zinc-500 hover:text-zinc-300">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <input type="hidden" id="edit-alias-id" />
      <div>
        <label class="block text-[11px] font-medium text-zinc-400 mb-1">Nuevo Nombre del Servidor</label>
        <input 
          type="text" 
          id="edit-alias-input" 
          class="w-full bg-[#18181b] border border-white/[0.08] rounded-md px-3 py-1.5 text-xs text-zinc-100 focus:outline-none focus:border-indigo-500"
        />
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeModal('modal-edit-alias')" class="px-3 py-1.5 rounded-md text-xs text-zinc-400 hover:text-white">
          Cancelar
        </button>
        <button onclick="handleSaveAlias()" class="px-3.5 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium transition">
          Guardar Cambios
        </button>
      </div>
    </div>
  </div>
