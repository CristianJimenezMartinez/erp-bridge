<!-- 0. ANNOUNCEMENT BAR (BETA) -->
  <div id="beta-announcement-bar" class="relative bg-zinc-900 border-b border-indigo-500/20 px-4 py-2 sm:px-6 lg:px-8 flex items-center justify-center transition-all duration-300">
    <div class="text-xs sm:text-sm font-medium text-zinc-300 flex items-center gap-2.5 flex-wrap justify-center text-center">
      <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-indigo-500/10 border border-indigo-500/25 text-[11px] font-semibold tracking-wide uppercase text-indigo-300">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Beta Abierta
      </span>
      <span>Beta Abierta: Acceso completo gratuito para todas las empresas hasta el 31 de diciembre.</span>
      <a href="/beta/" class="inline-flex items-center gap-1 bg-indigo-600/80 hover:bg-indigo-600 text-white font-medium text-xs px-2.5 py-1 rounded-md transition shadow-sm ml-1">
        Solicitar Clave Gratis <span aria-hidden="true">&rarr;</span>
      </a>
    </div>
    <button type="button" id="close-beta-banner" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 hover:bg-indigo-500 rounded-md text-indigo-100 hover:text-white transition focus:outline-none" aria-label="Dismiss">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
      </svg>
    </button>
  </div>
  <script>
    (function() {
      var banner = document.getElementById('beta-announcement-bar');
      var btn = document.getElementById('close-beta-banner');
      if (localStorage.getItem('hideBetaBanner') === 'true') {
        if(banner) banner.style.display = 'none';
      }
      if (btn && banner) {
        btn.addEventListener('click', function() {
          banner.style.display = 'none';
          localStorage.setItem('hideBetaBanner', 'true');
        });
      }
      // Ocultación automática de elementos beta si la fecha es posterior al 31/12/2026
      if (Date.now() > new Date('2026-12-31T23:59:59Z').getTime()) {
        if (banner) banner.style.display = 'none';
        var navBetaBtn = document.getElementById('nav-beta-btn');
        if (navBetaBtn) navBetaBtn.style.display = 'none';
      }
    })();
  </script>
