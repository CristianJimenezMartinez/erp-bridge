<!-- MODAL CHECKOUT STRIPE ELEGANTE & SEGURO -->
<div id="modal-checkout-landing" onclick="if(event.target === this) cerrarCheckoutModal()" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
  <div class="relative w-full max-w-md bg-[#121215] border border-white/[0.1] rounded-2xl p-6 sm:p-7 shadow-2xl shadow-indigo-950/40">
    <!-- Botón cerrar -->
    <button onclick="cerrarCheckoutModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white transition p-1 rounded-lg hover:bg-white/[0.05]">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Encabezado con branding -->
    <div class="flex items-center gap-3 mb-5">
      <div class="w-10 h-10 rounded-xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <div>
        <h3 class="text-lg font-bold text-white leading-tight">Activar Licencia</h3>
        <p class="text-xs text-zinc-400 mt-0.5">Bentian ERP Bridge — Conexión Factusol</p>
      </div>
    </div>

    <!-- Tarjeta resumen del plan -->
    <div class="p-3.5 rounded-xl bg-[#18181b] border border-white/[0.08] mb-5">
      <div class="flex items-center justify-between">
        <div>
          <span id="checkout-plan-name" class="font-semibold text-sm text-white">Plan Base Anual</span>
          <p id="checkout-plan-desc" class="text-xs text-zinc-400 mt-0.5">Activación inmediata en 60s. Sin permanencia.</p>
        </div>
        <div class="text-right">
          <span id="checkout-plan-price" class="text-lg font-mono font-bold text-white">199 €</span>
          <span id="checkout-plan-cycle" class="text-[11px] text-zinc-400 block">/ año + IVA</span>
        </div>
      </div>
    </div>

    <!-- Formulario de email con validación -->
    <form id="form-checkout-landing" onsubmit="procesarCheckoutModal(event)" class="space-y-4">
      <div>
        <label for="checkout-email-input" class="block text-xs font-medium text-zinc-300 mb-1.5">
          Correo Electrónico de Facturación y Licencia:
        </label>
        <div class="relative">
          <input 
            type="email" 
            id="checkout-email-input" 
            required 
            placeholder="admin@tuempresa.es" 
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#09090b] border border-white/[0.1] text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          />
        </div>
        <p class="text-[11px] text-zinc-400 mt-1.5 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-zinc-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Tu clave de activación y el acceso a tu panel quedarán vinculados a este correo.
        </p>
      </div>

      <!-- Mensaje de error -->
      <div id="checkout-error-msg" class="hidden p-3 rounded-lg bg-red-950/40 border border-red-500/30 text-xs text-red-300"></div>

      <!-- Consentimiento Legal Obligatorio (LSSI-CE & RGPD) -->
      <div class="pt-1">
        <label class="flex items-start gap-2.5 text-[11px] text-zinc-400 cursor-pointer select-none">
          <input 
            type="checkbox" 
            id="checkout-legal-consent" 
            required 
            class="mt-0.5 rounded bg-[#09090b] border border-white/[0.2] text-indigo-600 focus:ring-0 focus:ring-offset-0 cursor-pointer shrink-0"
          />
          <span class="leading-relaxed">
            He leído y acepto los 
            <a href="javascript:void(0)" onclick="abrirModalLegal('terminos')" class="text-indigo-400 underline hover:text-indigo-300">Términos de Contratación</a> 
            y la 
            <a href="javascript:void(0)" onclick="abrirModalLegal('privacidad')" class="text-indigo-400 underline hover:text-indigo-300">Política de Privacidad</a> 
            (RGPD / LSSI-CE).
          </span>
        </label>
      </div>

      <!-- Botón de Envío -->
      <button 
        type="submit" 
        id="btn-submit-checkout" 
        class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span id="btn-submit-text">Continuar al Pago Seguro con Stripe</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

      <!-- Garantía de Seguridad -->
      <div class="flex items-center justify-center gap-2 pt-1 text-[11px] text-zinc-400 font-mono">
        <svg class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Procesamiento encriptado AES-256 vía Stripe SSL</span>
      </div>
    </form>
  </div>
</div>
