name: Continuous Deployment (Hetzner Production)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/deploy-hetzner.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  deploy:
    name: Build, Quality Gate & Deploy to Hetzner
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Quality Gate Audit (7 Gates)
        run: pnpm run quality:check

      - name: Deploy to Hetzner Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.105.87.40
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Sincronizando repositorio en /opt/bentian/erp-bridge..."
            cd /opt/bentian/erp-bridge
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e .env.*
            echo "🔄 Compilando y levantando contenedor bentian-api-prod..."
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            echo "✅ Despliegue completado con éxito."

      - name: Live Health Check
        run: |
          echo "Esperando a que el contenedor complete su arranque y conexión..."
          for i in {1..8}; do
            sleep 4
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://bridge.cristianjm.com/health || true)
            echo "Intento $i/8 - Health Check HTTP Status: $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Servidor respondiendo 200 OK en bridge.cristianjm.com"
              exit 0
            fi
          done
          echo "❌ Falló el health check en producción tras varios reintentos"
          exit 1
